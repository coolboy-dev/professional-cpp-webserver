# Comparison baseline: nginx serving the same webroot/ on 127.0.0.1:18090.
#   nix-shell -p nginx --run 'nginx -p "$PWD" -c bench/nginx.conf'
#   bench/bench.sh --url http://127.0.0.1:18090 --label nginx
#   nix-shell -p nginx --run 'nginx -p "$PWD" -c bench/nginx.conf -s quit'
worker_processes auto;
pid /tmp/nginx-bench.pid;
error_log /tmp/nginx-bench-error.log;
daemon on;
events { worker_connections 16384; }
http {
  access_log off;
  default_type text/html;
  types { text/html html; }
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000000;
  client_body_temp_path /tmp/nginx-bench-tmp/body;
  proxy_temp_path /tmp/nginx-bench-tmp/proxy;
  fastcgi_temp_path /tmp/nginx-bench-tmp/fastcgi;
  uwsgi_temp_path /tmp/nginx-bench-tmp/uwsgi;
  scgi_temp_path /tmp/nginx-bench-tmp/scgi;
  server {
    listen 127.0.0.1:18090 backlog=4096;
    root webroot;
    location / { index index.html; }
  }
}
